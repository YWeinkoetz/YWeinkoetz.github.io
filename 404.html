<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Seite nicht gefunden · Youness Weinkötz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .notfound {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14vh 1.5rem 12vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .notfound .code {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .notfound h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(3rem, 12vw, 7rem);
    line-height: 0.95;
    margin: 1rem 0 1.5rem;
    color: var(--ink);
  }
  .notfound h1 em { font-style: italic; color: var(--accent); }
  .notfound p {
    max-width: 48ch;
    color: var(--ink-mid);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .notfound .home-link {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    padding: 0.85rem 1.4rem;
    border: 1px solid var(--ink);
    border-radius: 100px;
    transition: background 0.2s, color 0.2s;
  }
  .notfound .home-link:hover { background: var(--ink); color: var(--paper); }
  .notfound .home-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div class="masthead-inner">
      <div class="left">
        <a class="mono-name" href="/" style="color:inherit;text-decoration:none;">YW &nbsp;/&nbsp; Portfolio</a>
      </div>
      <div class="center"></div>
      <div class="right">
        <button class="lang-toggle" onclick="toggleLang()" aria-label="Switch language">
          <span class="lang-opt" data-lang="de">DE</span>
          <span class="lang-sep">/</span>
          <span class="lang-opt" data-lang="en">EN</span>
        </button>
      </div>
    </div>
  </header>

  <section class="notfound">
    <div class="code" data-de="Fehler 404" data-en="Error 404">Fehler 404</div>
    <h1 data-de="Seite nicht<br><em>gefunden.</em>" data-en="Page not<br><em>found.</em>">Seite nicht<br><em>gefunden.</em></h1>
    <p data-de="Die aufgerufene Seite existiert nicht oder wurde verschoben. Vielleicht hilft ein Blick auf die Projektübersicht weiter." data-en="The page you requested doesn't exist or has moved. The project overview is a good place to continue.">
      Die aufgerufene Seite existiert nicht oder wurde verschoben. Vielleicht hilft ein Blick auf die Projektübersicht weiter.
    </p>
    <a class="home-link" href="/">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span data-de="Zur Startseite" data-en="Back to home">Zur Startseite</span>
    </a>
  </section>

</div>

<script>
const LANG_KEY = 'portfolio-lang';
let currentLang = localStorage.getItem(LANG_KEY) || 'de';
function applyLang() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('.lang-opt').forEach(opt => opt.classList.toggle('active', opt.getAttribute('data-lang') === currentLang));
  document.querySelectorAll('[data-de]').forEach(el => { el.innerHTML = currentLang === 'de' ? el.getAttribute('data-de') : el.getAttribute('data-en'); });
}
function toggleLang() {
  currentLang = currentLang === 'de' ? 'en' : 'de';
  localStorage.setItem(LANG_KEY, currentLang);
  applyLang();
}
applyLang();
</script>
</body>
</html>
